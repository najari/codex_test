[package]
name = "canlog"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Streaming CAN log recorder and playback engine"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
encoding_rs = "0.8"
flate2 = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
candb-engine = { git = "https://github.com/najari/candb-csharp-clone", rev = "c51f18848dc4e32afd96b1a6e5bc975da70c6828" }
cdd-api = { git = "https://github.com/najari/cdd-rust-engine", rev = "9207dfc845d5d256eb479073824bad234b27f79b", optional = true }

[features]
default = []
cdd = ["dep:cdd-api"]

[dev-dependencies]
csv = "=1.4.0"

[profile.release]
lto = "thin"
