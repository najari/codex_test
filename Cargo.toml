[package]
name = "canlog"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Streaming CAN log recorder and playback engine"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
encoding_rs = "0.8"
flate2 = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = "thin"
